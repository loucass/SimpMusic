name: Offline-first canvas CI

on:
  push:
    branches:
      - ci/canvas-offline-check
  workflow_dispatch:

concurrency:
  group: offline-first-canvas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Prepare local.properties
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          touch local.properties
          [ -n "$SENTRY_DSN" ] && echo "SENTRY_DSN=$SENTRY_DSN" >> local.properties || true
          [ -n "$SENTRY_AUTH_TOKEN" ] && echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" >> local.properties || true
          [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties || true
          [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties || true

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Run JVM tests
        run: ./gradlew :composeApp:jvmTest --stacktrace

      - name: Build debug APK (arm64 only)
        run: ./gradlew :androidApp:assembleDebug -PciAbi=arm64-v8a --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: composeApp/build/reports/tests/jvmTest
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
