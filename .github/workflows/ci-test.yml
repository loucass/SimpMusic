name: CI Test Build

on:
  push:
    branches:
      - 'ci/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Configure full build
        run: |
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Run JVM tests
        run: ./gradlew :composeApp:jvmTest --no-daemon

      - name: Build debug APK (arm64 only for Samsung A07)
        run: ./gradlew :androidApp:assembleDebug -PciAbi=arm64-v8a --no-daemon

      - name: Upload arm64 debug APK only
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-arm64
          path: androidApp/build/outputs/apk/debug/*arm64-v8a*.apk
          retention-days: 1

      - name: Report APK sizes
        run: |
          echo "=== APK Sizes ==="
          for f in androidApp/build/outputs/apk/debug/*arm64-v8a*.apk; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              size_mb=$((size / 1024 / 1024))
              echo "$(basename "$f"): ${size_mb} MB ($size bytes)"
            fi
          done